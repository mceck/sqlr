# Fixed services for the integration tests. Nothing starts a container per test: every
# server is long-lived and `make test` starts this file once.
#
# Fixed ports on purpose: the test support modules read them from SQLR_TEST_* env vars
# (see `sqlr_testkit::service`). TLS certificates are generated by
# `scripts/test-services.sh` into `.test-services/certs`.
name: sqlr-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    # Test-only durability: checkpoints must not stall the suite on Docker's disk.
    command:
      ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  # Server-global PostgreSQL tests (roles, sessions, database lists) run one at a time
  # here. TLS is on, but not required.
  postgres-global:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    # Test-only durability: checkpoints must not stall the suite on Docker's disk.
    command:
      ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    volumes:
      - ./.test-services/certs:/certs:ro
      - ./scripts/postgres-tls-init.sh:/docker-entrypoint-initdb.d/10-tls.sh:ro
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: test
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 120

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: test
    ports:
      - "127.0.0.1:53307:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 120

  # MySQL/MariaDB tests that create databases, users or roles run one at a time here.
  mysql-global:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:53310:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 120

  mariadb-global:
    image: mariadb:11.4
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:53311:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 120

  # A MySQL without TLS, for the test that requires TLS and must fail.
  mysql-notls:
    image: mysql:8.4
    command: ["--tls-version="]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:53312:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 1s
      timeout: 3s
      retries: 120

  mariadb-notls:
    image: mariadb:11.4
    command: ["--skip-ssl"]
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:53313:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "--silent", "--skip-ssl"]
      interval: 1s
      timeout: 3s
      retries: 120

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60

  mongo-auth:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: s3cret
    ports:
      - "127.0.0.1:57018:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "root",
          "-p",
          "s3cret",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 2s
      timeout: 5s
      retries: 90

  redis:
    image: redis:7
    # The tests write multi-megabyte values; background snapshots only add disk stalls.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60

  redis-tls:
    image: redis:7
    volumes:
      - ./.test-services/certs:/tls:ro
    command:
      [
        "redis-server",
        "--port",
        "0",
        "--tls-port",
        "6379",
        "--tls-cert-file",
        "/tls/server.crt",
        "--tls-key-file",
        "/tls/server.key",
        "--tls-ca-cert-file",
        "/tls/ca.crt",
        "--tls-auth-clients",
        "no",
        "--save",
        "",
        "--appendonly",
        "no",
        "--user",
        "alice",
        "on",
        ">s3cret",
        "~*",
        "&*",
        "+@all",
      ]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cacert", "/tls/ca.crt", "-p", "6379", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.destructive_requires_name: "false"
      search.keep_alive_interval: "1s"
    ports:
      - "127.0.0.1:59200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s

  # Elasticsearch 7.17 for the version-specific API checks.
  elasticsearch7:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.25
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.destructive_requires_name: "false"
    ports:
      - "127.0.0.1:59201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 20s

  # Elasticsearch 8 with security on (HTTP, no TLS), for auth and API keys.
  elasticsearch-auth:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      action.destructive_requires_name: "false"
      ELASTIC_PASSWORD: "s3cret-pw"
    ports:
      - "127.0.0.1:59202:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 30s

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "yourStrong(!)Password"
    ports:
      - "127.0.0.1:51433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b",
        ]
      interval: 2s
      timeout: 5s
      retries: 120
      start_period: 20s

  oracle:
    image: gvenzl/oracle-free:latest
    environment:
      ORACLE_PASSWORD: oracle
    volumes:
      - ./scripts/oracle-init:/container-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:51521:1521"
    shm_size: 1g
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s
