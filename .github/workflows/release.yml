name: release

# Push a tag like `v0.1.0` to build every platform and publish a GitHub release.
# The tag must match the version in crates/sqlr-app/Cargo.toml.
# Each platform also publishes the sidecar drivers the Driver Manager downloads:
# Includes MongoDB (sqlr-driver-mongodb) on every platform.
# sqlr-driver-<id>_<version>_<os>-<arch>.tar.gz, listed in SHA256SUMS.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Check the tag against the crate version
        run: |
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/sqlr-app/Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/sqlr-app version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build, package and wrap each architecture in a dmg
        run: |
          for pair in aarch64-apple-darwin:arm64 x86_64-apple-darwin:x86_64; do
            target=${pair%%:*}
            arch=${pair##*:}
            cargo build --release -p sqlr-app --bin sqlr --target "$target"
            "target/$target/release/sqlr" --version
            scripts/package-macos.sh --bin "target/$target/release/sqlr" --out "dist/$arch/sqlr.app"
            stage="dist/stage-$arch"
            mkdir -p "$stage"
            cp -R "dist/$arch/sqlr.app" "$stage/"
            ln -s /Applications "$stage/Applications"
            cat > "$stage/README.txt" <<'EOF'
          sqlr for macOS
          ==============

          Install: drag sqlr.app onto the Applications shortcut.

          The app is ad-hoc signed, not notarized, so Gatekeeper asks on the
          first launch. Either right-click sqlr.app and choose Open, or run:

            xattr -dr com.apple.quarantine /Applications/sqlr.app
          EOF
            hdiutil create -volname "sqlr" -srcfolder "$stage" -ov -format UDZO \
              "sqlr_${VERSION}_macos-${arch}.dmg"
          done
      - name: Build and pack the sidecar drivers
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            scripts/package-release-drivers.sh . --target "$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            sqlr_${{ env.VERSION }}_macos-*.dmg
            sqlr-driver-*_${{ env.VERSION }}_macos-*.tar.gz
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev pkg-config
      - name: Build
        run: cargo build --release -p sqlr-app --bin sqlr
      - name: Smoke test
        run: target/release/sqlr --version
      - name: Stage the distribution
        run: |
          stage="sqlr_${VERSION}_linux-${ARCH}"
          mkdir -p "$stage/bin" "$stage/share/applications" "$stage/share/icons/hicolor/1024x1024/apps"
          cp target/release/sqlr "$stage/bin/sqlr"
          cp docs/media/icon.png "$stage/share/icons/hicolor/1024x1024/apps/sqlr.png"
          cat > "$stage/share/applications/sqlr.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=sqlr
          GenericName=Database client
          Comment=Universal database client
          Exec=sqlr
          Icon=sqlr
          Terminal=false
          Categories=Development;Database;
          Keywords=sql;database;db;client;
          EOF
          cat > "$stage/README.txt" <<EOF
          sqlr for Linux (${ARCH})
          ========================

          Run it directly:            ./bin/sqlr
          Or install it system-wide:   sudo cp -r bin share /usr/local/
          EOF
          tar -czf "${stage}.tar.gz" "$stage"
      - name: Build the AppImage
        run: |
          appdir=AppDir
          mkdir -p "$appdir/usr/bin"
          cp target/release/sqlr "$appdir/usr/bin/sqlr"
          cp docs/media/icon.png "$appdir/sqlr.png"
          cat > "$appdir/sqlr.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=sqlr
          GenericName=Database client
          Comment=Universal database client
          Exec=sqlr
          Icon=sqlr
          Terminal=false
          Categories=Development;Database;
          Keywords=sql;database;db;client;
          EOF
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/sqlr" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH}.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" "sqlr_${VERSION}_linux-${ARCH}.AppImage"
      - name: Build and pack the sidecar drivers
        run: scripts/package-release-drivers.sh . --platform "linux-${ARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            sqlr_${{ env.VERSION }}_linux-${{ matrix.arch }}.tar.gz
            sqlr_${{ env.VERSION }}_linux-${{ matrix.arch }}.AppImage
            sqlr-driver-*_${{ env.VERSION }}_linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: cargo build --release -p sqlr-app --bin sqlr
      - name: Smoke test
        run: ./target/release/sqlr.exe --version
      - name: Stage the distribution
        run: Compress-Archive -Path ./target/release/sqlr.exe -DestinationPath "sqlr_${env:VERSION}_windows-x86_64.zip"
      - name: Build and pack the sidecar drivers
        shell: bash
        run: sh scripts/package-release-drivers.sh . --platform windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            sqlr_${{ env.VERSION }}_windows-x86_64.zip
            sqlr-driver-*_${{ env.VERSION }}_windows-x86_64.tar.gz
          if-no-files-found: error

  release:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
