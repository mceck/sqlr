[package]
name = "sqlr-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

# Link the integration tests once instead of once per module.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

[[test]]
name = "diagnostics"
path = "tests/diagnostics.rs"

# The app menu on macOS is named after the executable; call it sqlr, like the product.
[[bin]]
name = "sqlr"
path = "src/main.rs"

[dependencies]
sqlr-core = { path = "../sqlr-core" }
sqlr-driver-elastic = { path = "../sqlr-driver-elastic" }
sqlr-driver-mongo = { path = "../sqlr-driver-mongo" }
sqlr-driver-mssql = { path = "../sqlr-driver-mssql" }
sqlr-driver-mysql = { path = "../sqlr-driver-mysql" }
sqlr-driver-oracle = { path = "../sqlr-driver-oracle" }
sqlr-driver-postgres = { path = "../sqlr-driver-postgres" }
sqlr-driver-redis = { path = "../sqlr-driver-redis" }
sqlr-driver-sqlite = { path = "../sqlr-driver-sqlite" }
sqlr-engine = { path = "../sqlr-engine" }
sqlr-mcp = { path = "../sqlr-mcp" }
sqlr-terminal = { path = "../sqlr-terminal" }
sqlr-store = { path = "../sqlr-store" }
sqlr-ui = { path = "../sqlr-ui" }
anyhow.workspace = true
arboard.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras = { workspace = true, features = ["image"] }
image.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
rfd.workspace = true
# The update check (spec §12): one HTTPS request a day and the release archive itself.
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
rustls-native-certs.workspace = true
semver = "1"
serde.workspace = true
sha2 = "0.11"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde_json.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The native menu bar and About panel; eframe/winit only provide the minimal app menu.
muda.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
# `wgpu` renders the screenshots of the ignored `screenshots` test; eframe already builds wgpu.
egui_kittest = { workspace = true, features = ["wgpu"] }
sqlr-testkit = { path = "../sqlr-testkit" }
# Writes a foreign `demo.sqlite` and reads the generated demo database back.
rusqlite.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
