[package]
name = "sqlr-driver-postgres"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

# Share compilation and linking across the integration test modules.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
sqlr-core = { path = "../sqlr-core" }
async-trait.workspace = true
futures-util.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tracing.workspace = true

[dev-dependencies]
sqlr-driver-tests = { path = "../sqlr-driver-tests" }
sqlr-engine = { path = "../sqlr-engine" }
sqlr-testkit = { path = "../sqlr-testkit" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
rcgen.workspace = true
tempfile.workspace = true
