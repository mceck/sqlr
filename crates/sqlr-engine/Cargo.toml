[package]
name = "sqlr-engine"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

# Link the integration tests once instead of once per module.
[[test]]
name = "integration"
path = "tests/integration.rs"

# Peak RSS must be measured in a separate process, including under plain cargo test.
[[test]]
name = "transfer_memory"
path = "tests/transfer_memory.rs"

[dependencies]
sqlr-core = { path = "../sqlr-core" }
sqlr-store = { path = "../sqlr-store" }
sqlr-registry = { path = "../sqlr-registry" }
sqlr-sidecar = { path = "../sqlr-sidecar" }
parking_lot.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "time", "io-util", "macros", "fs", "process"] }
tempfile.workspace = true
memmap2.workspace = true
tracing.workspace = true
thiserror.workspace = true
russh.workspace = true
rusqlite.workspace = true
calamine = { version = "0.37", default-features = false }
rust_xlsxwriter = { version = "0.101", default-features = false, features = ["constant_memory"] }
parquet = { version = "60", default-features = false, features = ["snap", "flate2-rust_backend", "zstd"] }
encoding_rs = "0.8.42"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
minisign = "0.7"
tar = "0.4"
flate2 = "1"
sqlr-driver-elastic = { path = "../sqlr-driver-elastic" }
sqlr-driver-mongo = { path = "../../drivers/sqlr-driver-mongo" }
sqlr-driver-mssql = { path = "../sqlr-driver-mssql" }
sqlr-driver-mysql = { path = "../sqlr-driver-mysql" }
sqlr-driver-oracle = { path = "../sqlr-driver-oracle" }
sqlr-driver-postgres = { path = "../sqlr-driver-postgres" }
sqlr-driver-redis = { path = "../sqlr-driver-redis" }
sqlr-driver-sqlite = { path = "../sqlr-driver-sqlite" }
sqlr-testkit = { path = "../sqlr-testkit" }
tracing-subscriber.workspace = true
rustls.workspace = true
redis.workspace = true
reqwest.workspace = true
mongodb.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
