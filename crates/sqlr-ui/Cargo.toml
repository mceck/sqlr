[package]
name = "sqlr-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

# Link the integration tests once instead of once per module.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
sqlr-core = { path = "../sqlr-core" }
arboard.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui-phosphor.workspace = true
image.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
ropey.workspace = true
tree-sitter.workspace = true
tree-sitter-sequel.workspace = true
similar = { version = "2", default-features = false, features = ["text"] }

[dev-dependencies]
memory-stats.workspace = true
egui_kittest.workspace = true
sqlr-testkit = { path = "../sqlr-testkit" }
