[package]
name = "sqlr-driver-sqlite"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

# Share compilation and linking across the integration test modules.
[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
sqlr-core = { path = "../sqlr-core" }
async-trait.workspace = true
rusqlite = { workspace = true, features = ["column_decltype", "column_metadata"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
sqlr-driver-tests = { path = "../sqlr-driver-tests" }
sqlr-engine = { path = "../sqlr-engine" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
