[workspace]
members = ["crates/*", "drivers/sqlr-driver-duckdb", "drivers/sqlr-driver-hana", "drivers/sqlr-driver-mongo"]
# `cargo run` and `cargo build` without -p act on the app; the sidecar drivers are extra binaries.
default-members = ["crates/sqlr-app"]
exclude = ["fuzz", "templates", "tools"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
eframe = "=0.36.2"
egui = "=0.36.2"
egui_extras = "=0.36.2"
egui_kittest = "=0.36.2"
egui_dock = "0.21.1"
egui-phosphor = "0.14.0"
memory-stats = "1"
tokio = "1"
tokio-postgres = "0.7"
tokio-util = { version = "0.7", features = ["compat"] }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds80"] }
oracle-rs = "0.1.7"
async-trait = "0.1"
parking_lot = "0.12"
percent-encoding = "2"
toml = "1"
# Format-preserving edits of agent configuration files (Agent installations).
toml_edit = "0.25"
jsonc-parser = { version = "0.34", features = ["cst", "serde_json"] }
directories = "6"
keyring = "4"
uuid = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
thiserror = "2"
tempfile = "3"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
rusqlite = { version = "0.37", features = ["bundled", "backup", "trace"] }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
tree-sitter = "0.27"
tree-sitter-sequel = "0.3"
nucleo-matcher = "0.3"
jiff = "0.2"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
bytes = "1"
base64 = "0.22"
getrandom = "0.3"
schemars = "1"
rmcp = { version = "=3.7.0", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
] }
portable-pty = "=0.9.0"
vt100 = "=0.18.1"
rmp-serde = "1.3"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = "3"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-insecure"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSAttributedString", "NSData", "NSDictionary", "NSString", "NSObject"] }

# Rust best-practice gates (Architecture spec, "Code quality gates").
[workspace.lints.clippy]
redundant_clone = "deny"
needless_collect = "deny"
unnecessary_wraps = "deny"
needless_pass_by_value = "deny"
map_unwrap_or = "deny"
manual_let_else = "deny"
manual_ok_or = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"

# Tests need line tables, not full DWARF: this cuts link time and binary size significantly.
# Dependencies keep no debug info; their frames still show by symbol in backtraces.
# A debugging session can restore full info with `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

# Spec §1.3: under 75 MB installed. Symbols stripped, full LTO, one codegen unit; panics
# still unwind so engine command panics can become failed operations and incidents.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "unwind"

# Keep the DuckDB sidecar compact; cc inherits this optimization level for DuckDB's
# bundled C++ sources as well as its Rust bindings.
[profile.release.package.libduckdb-sys]
opt-level = "s"
