# `cargo test` runs test binaries one at a time; nextest runs them concurrently.
# Install with `cargo install cargo-nextest --locked`.

[profile.default]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "slow"
final-status-level = "slow"

# The egui smoke tests drive a real event loop and are timing-sensitive when many run at
# once; two at a time is stable and still much faster than serializing them.
[test-groups.app]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(sqlr-app) and binary(smoke)'
test-group = "app"

# Each sidecar test builds the SDK examples through `cargo`; run them one at a time so
# they do not wait on cargo's package lock while a probe's handshake times out.
[test-groups.sidecar]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(sqlr-sidecar)'
test-group = "sidecar"

# Longer timeout for the Docker-backed suite. All servers are fixed services, so the
# tests can use every core like the rest of the workspace.
[profile.containers]
inherits = "default"
slow-timeout = { period = "120s", terminate-after = 4 }

# Keep one retry as a safety net for a missed click in the event loop.
[[profile.containers.overrides]]
filter = 'package(sqlr-app) and binary(smoke)'
retries = 1
