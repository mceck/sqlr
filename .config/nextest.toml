# `cargo test` runs test binaries one at a time; nextest runs them concurrently.
# Install with `cargo install cargo-nextest --locked`.

[profile.default]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "slow"
final-status-level = "slow"

# Docker-backed suites share four slots, so testcontainers does not start dozens of
# databases at once. UI and core tests still use every core.
[test-groups.containers]
max-threads = 4

[[profile.default.overrides]]
filter = 'package(sqlr-driver-postgres) or package(sqlr-driver-mysql) or package(sqlr-driver-redis) or package(sqlr-driver-mongo) or package(sqlr-driver-elastic) or package(sqlr-engine)'
test-group = "containers"

# Longer timeout for the Docker-backed suite, plus one retry for the occasional
# testcontainers port-mapping race. `cargo nextest run --profile containers`.
[profile.containers]
inherits = "default"
retries = 1
slow-timeout = { period = "120s", terminate-after = 4 }
