# `cargo test` runs test binaries one at a time; nextest runs them concurrently.
# Install with `cargo install cargo-nextest --locked`.

[profile.default]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "slow"
final-status-level = "slow"

# The egui smoke tests drive a real event loop and are timing-sensitive when many run at
# once; two at a time is stable and still much faster than serializing them.
[test-groups.app]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(sqlr-app) and binary(smoke)'
test-group = "app"

# Every suite that runs `cargo build -p sqlr-driver-sdk --example echo_driver` takes the
# same process-wide build lock. Run them one at a time: a stack of waiters looks like a
# hung test and reaches the slow timeout before cargo gets to them.
[test-groups.sidecar]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(sqlr-sidecar)'
test-group = "sidecar"

[[profile.default.overrides]]
filter = 'package(sqlr-engine) and binary(drivers)'
test-group = "sidecar"

[[profile.default.overrides]]
filter = 'package(sqlr-registry)'
test-group = "sidecar"

# Longer timeout for the integration suite (Docker or native fixed services). All servers
# are fixed services, so the tests can use every core like the rest of the workspace.
[profile.containers]
inherits = "default"
slow-timeout = { period = "120s", terminate-after = 4 }

# Keep one retry as a safety net for a missed click in the event loop.
[[profile.containers.overrides]]
filter = 'package(sqlr-app) and binary(smoke)'
retries = 1
